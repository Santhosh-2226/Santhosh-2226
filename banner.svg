<text x="501" y="131" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="98" letter-spacing="6" fill="#00aa2e">SANTHOSH</text>
<text x="500" y="130" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="98" letter-spacing="6" fill="#00ff41" filter="url(#f-glow)" class="main-name">SANTHOSH</text>

<!-- 3D IYYAPPAN extrusion layers -->
<text x="507" y="188" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="20" fill="#001406">IYYAPPAN</text>
<text x="506" y="187" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="20" fill="#002d0b">IYYAPPAN</text>
<text x="505" y="186" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="20" fill="#004812">IYYAPPAN</text>
<text x="504" y="185" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="20" fill="#006419">IYYAPPAN</text>
<text x="503" y="184" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="20" fill="#008022">IYYAPPAN</text>
<text x="502" y="183" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="20" fill="#00a02b">IYYAPPAN</text>
<text x="500" y="182" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="20" fill="#00ee3a" filter="url(#f-glow2)" class="last-name">IYYAPPAN</text>

<!-- Subtitle -->
<text x="500" y="218" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" letter-spacing="3" fill="#009922" class="subtitle">AI SYSTEMS ENGINEER  |  SDE  |  BUILDER OF REAL SYSTEMS</text>

<!-- Divider -->
<line x1="120" y1="234" x2="880" y2="234" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.2"/>

<!-- Status row -->
<g font-family="'Courier New',monospace" font-size="11" filter="url(#f-soft)">
  <circle cx="195" cy="256" r="4" fill="#00ff41" class="dot1"/>
  <text x="207" y="260" fill="#006b1a">STATUS:</text>
  <text x="263" y="260" fill="#00ff41" font-weight="bold">ONLINE</text>

  <circle cx="370" cy="256" r="4" fill="#00ff41" class="dot2"/>
  <text x="382" y="260" fill="#006b1a">MODE:</text>
  <text x="428" y="260" fill="#00ff41" font-weight="bold">BUILD</text>

  <circle cx="518" cy="256" r="4" fill="#00ff41" class="dot3"/>
  <text x="530" y="260" fill="#006b1a">CLEARANCE:</text>
  <text x="622" y="260" fill="#00ff41" font-weight="bold">L3</text>

  <circle cx="672" cy="256" r="4" fill="#00ff41" class="dot4"/>
  <text x="684" y="260" fill="#006b1a">UPTIME:</text>
  <text x="740" y="261" fill="#00ff41" font-weight="bold" font-size="15">∞</text>
</g>

<!-- Bottom tagline -->
<text x="500" y="300" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" letter-spacing="2" fill="#00ff4140">Think → Build → Debug → Scale → Repeat</text>

</svg>
